[package]
name = "epdsi_x3"
version = "0.1.0"
edition = "2024"

[dependencies]
epdsi = { version = "0.8", default-features = false }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
maybe-async-cfg = "0.2"

[features]
default = ["blocking"]
blocking = ["epdsi/blocking"]   # the name must be `blocking`
